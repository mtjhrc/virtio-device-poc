[package]
name = "vhost"
version = "0.1.0"
edition = "2021"

[dependencies]
vhost = { version = "0.13.0", features = ["vhost-user-backend"] }
vhost-user = { path = "../../vhost-user" }
virtio = { path = "../../virtio" }
virtio-console = { path = "../virtio-console" }
vm-memory = "0.16.1"
log = "0.4.25"
env_logger = "0.11.6"
anyhow = "1.0.95"
nix = { version = "0.29.0", features = ["term", "fs"] }
derive_more = { version = "2.0.1", features = ["as_ref"] }